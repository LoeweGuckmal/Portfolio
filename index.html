<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simon's Projects</title>
    <meta name="description" content="Projects and open-source contributions by Simon (LoeweGuckmal)." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme choice before the first paint (no flash). Without one, CSS follows the system.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%23fbf8f3' stroke='%2323201c' stroke-width='4'/%3E%3Ccircle cx='24' cy='26' r='7' fill='%23e03e3e'/%3E%3Ccircle cx='42' cy='38' r='7' fill='%232d4fa8'/%3E%3Ccircle cx='26' cy='44' r='5' fill='%23ee7418'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- Decorative three.js background (progressive enhancement) -->
    <canvas id="bg" aria-hidden="true"></canvas>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" />
      </svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" />
      </svg>
    </button>

    <main class="page">
      <header class="hero">
        <h1 class="hero__title">
          <span id="site-title"></span>
          <svg class="hero__underline" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="underline-gradient" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" stop-color="#e03e3e" />
                <stop offset="35%" stop-color="#ee7418" />
                <stop offset="70%" stop-color="#2f9e44" />
                <stop offset="100%" stop-color="#2d4fa8" />
              </linearGradient>
            </defs>
            <path d="M6 18 C 70 6, 130 24, 200 14 S 330 6, 394 15" />
          </svg>
        </h1>
        <p class="hero__tagline" id="site-tagline"></p>
        <!--<div class="filter" id="tag-filter" role="group" aria-label="Highlight projects by tag"></div>-->
      </header>

      <div id="sections"></div>

      <noscript>
        <p class="noscript">This page needs JavaScript to list the projects. You can find them all on GitHub.</p>
      </noscript>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
